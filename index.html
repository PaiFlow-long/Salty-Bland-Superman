/* ---------- ④ 计算 ---------- */
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function dimsFromAnswers(ans){
  const d={...BASE};
  ans.forEach(a=>{ for(const k in a.d){ d[k]=(d[k]||0)+a.d[k]; } });
  for(const k in d){ d[k] = (k==='M')? clamp(d[k],-100,100) : clamp(d[k],0,100); }
  return d;
}
function saltOf(dims,datePrior){
  let A=0; for(const k in WEIGHT_S){ A += WEIGHT_S[k]*(dims[k]??0); }
  let s = 0.7*A + 0.3*datePrior;
  s += Math.max(0, dims.R - 80) * 1.0;   // 炸放大器：躁度极高 → 额外推咸（炸 = 过度唤醒）
  return clamp(s, 0, 100);
}
function valOf(dims){
  let V=0; for(const k in WEIGHT_V){ V += WEIGHT_V[k]*(dims[k]??0); }
  return clamp(V,-100,100);
}
function typeOf(salt,val,dims){
  // 矛盾咸：高能量却完全失控（心累内爆）这种罕见矛盾
  if(dims.E>=70 && dims.C<=30) return 'maodun';
  const sb = salt<49?0 : salt<58?1 : salt<67?2 : 3;
  const vb = val<-30?0 : val<=30?1 : 2;
  return `b${sb}v${vb}`;
}
function dateContext(){
  const now=new Date();
  const y=now.getFullYear();
  const md=`${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
  const sp=SPECIAL[y]? (SPECIAL[y][md]||null) : null;
  const prior = sp? sp.s : (DATE_PRIOR[now.getDay()]??50);
  return { y, md, prior, kind: sp? sp.kind : null, special: sp? sp.n : null, weekday:['周日','周一','周二','周三','周四','周五','周六'][now.getDay()] };
}
// 带日期的评价：节假日相关（kind）或 周一/周五/周六/周日 才给；普通周二三四返回 null
function dateFlavor(dc, copy, seedStr){
  let key=null;
  if(dc.kind) key=dc.kind;
  else if(['周一','周五','周六','周日'].includes(dc.weekday)) key=dc.weekday;
  else return null;
  const pool=DATE_FLAVOR[key];
  if(!pool) return null;
  const rand=lcg(hashCode(seedStr+key));
  const tpl=pool[Math.floor(rand()*pool.length)];
  return tpl.replace(/\{n\}/g, dc.special||'').replace(/\{name\}/g, copy.name);
}
// 受控随机：同一答案 + 同一天 → 同一结果，可复现
function hashCode(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function lcg(seed){let s=seed>>>0;return ()=>{s=(Math.imul(s,1664525)+1013904223)>>>0;return s/4294967296;};}
function pick(rand,arr){return arr[Math.floor(rand()*arr.length)];}

// 文案生成（预留接口：未来可在此接 LLM 做动态生成）
function generateCopy(typeKey, seedStr){
  const c=COPY[typeKey];
  const rand=lcg(hashCode(seedStr));
  return {
    emoji:c.emoji, name:c.name,
    diag: pick(rand,c.diag),
    yi: YI[typeKey],
    ji: JI[typeKey],
    lucky: pick(rand,LUCKY),
    egg: pick(rand,EGG),
  };
}

// —— 分享卡：Canvas 生成图片（零依赖，可保存）——
function wrapText(ctx, text, cx, y, maxW, lh){
  const chars=(text||'').split('');
  let line='', yy=y;
  for(const ch of chars){
    if(ctx.measureText(line+ch).width>maxW && line){ ctx.fillText(line,cx,yy); line=ch; yy+=lh; }
    else line+=ch;
  }
  if(line) ctx.fillText(line,cx,yy);
}
function drawBadge(x,cx,cy,r){
  x.save();
  if(logoReady && logoImg && logoImg.naturalWidth){
    // 直接展示形象图，不加边框、不裁圆形
    const w=r*2.1, h=logoImg.naturalHeight/logoImg.naturalWidth*w;
    x.drawImage(logoImg, cx-w/2, cy-h/2, w, h);
  }else{
    x.fillStyle='#E0A458'; x.beginPath(); x.arc(cx,cy,r,0,Math.PI*2); x.fill();
    x.fillStyle='#E8482B'; x.beginPath(); x.moveTo(cx,cy); x.arc(cx,cy,r,-Math.PI/2,0); x.closePath(); x.fill();
  }
  x.restore();
}
function makeShareCard(){
  const r=lastResult; if(!r) return;
  ensureLogo(()=>{
    const W=1080, pad=60, contentW=W-pad*2, H=1560;
    const cv=document.createElement('canvas'); cv.width=W; cv.height=H;
    const x=cv.getContext('2d');
    const cream='#FFF7EC', ink='#2A2118', red='#E8482B', gold='#E0A458', sub='#7a5a2a';
    const font=(px,weight)=>`${weight||''} ${px}px "PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif`;
    x.fillStyle=cream; x.fillRect(0,0,W,H);
    x.strokeStyle=ink; x.lineWidth=14; x.strokeRect(20,20,W-40,H-40);
    // 顶部品牌徽标（形象图 + 品牌名）
    drawBadge(x, 88, 92, 30);
    x.fillStyle=ink; x.textBaseline='middle'; x.textAlign='left';
    x.font=font(34,'bold'); x.fillText('PaiFlow 苹果派', 88+34+26, 92);
    // 标题 + 日期
    x.textAlign='center';
    x.font=font(56,'bold'); x.fillStyle=ink; x.fillText('今日状态卡', W/2, 210);
    x.font=font(30); x.fillStyle=sub;
    x.fillText(`${r.dc.weekday}${r.dc.special?'·'+r.dc.special:''} · 先验咸度 ${r.dc.prior}`, W/2, 262);
    // 大 emoji + 类型名
    x.font=font(190); x.fillText(r.copy.emoji, W/2, 430);
    x.font=font(72,'bold'); x.fillStyle=red; x.fillText(r.copy.name, W/2, 575);
    x.font=font(36); x.fillStyle=ink; x.fillText('你是「'+r.copy.name+'」', W/2, 632);
    // 咸度条
    const bx=pad+40, bw=W-pad*2-80, by=700, bh=46;
    x.fillStyle='#fff'; x.fillRect(bx,by,bw,bh);
    const g=x.createLinearGradient(bx,0,bx+bw,0); g.addColorStop(0,gold); g.addColorStop(1,red);
    x.fillStyle=g; x.fillRect(bx,by, bw*(Math.min(100,Math.max(0,r.salt))/100), bh);
    x.strokeStyle=ink; x.lineWidth=5; x.strokeRect(bx,by,bw,bh);
    x.font=font(26); x.fillStyle=ink;
    x.textAlign='left'; x.fillText('淡人', bx, by+bh+36);
    x.textAlign='center'; x.fillText('咸度 '+Math.round(r.salt), W/2, by+bh+36);
    x.textAlign='right'; x.fillText('咸人', bx+bw, by+bh+36);
    // 情绪正负
    x.textAlign='center'; x.font=font(34); x.fillStyle=ink;
    const v=r.val, vl=v<-30?'负向 😣':v<=30?'中性 😐':'正向 😊';
    x.fillText('情绪正负：'+vl+'（'+Math.round(v)+'）', W/2, by+bh+94);
    // 日期语境文案（若有）
    if(r.flavor){ x.font=font(30); x.fillStyle=sub; x.textAlign='center'; wrapText(x,'📅 '+r.flavor, W/2, by+bh+150, W-pad*2-40, 46); }
    // 今日宜 / 今日忌
    const boxY=1040, boxH=240, boxW=Math.round((contentW-20)/2);
    const drawBox=(bx2,title,items,tc)=>{
      x.fillStyle='#fff'; x.fillRect(bx2,boxY,boxW,boxH);
      x.strokeStyle=ink; x.lineWidth=5; x.strokeRect(bx2,boxY,boxW,boxH);
      x.textAlign='left'; x.textBaseline='middle';
      x.font=font(34,'bold'); x.fillStyle=tc; x.fillText(title, bx2+24, boxY+44);
      x.font=font(30); x.fillStyle=ink;
      let iy=boxY+104;
      for(const it of items){ x.fillText('· '+it, bx2+24, iy); iy+=54; }
    };
    drawBox(pad, '今日宜', r.copy.yi, gold);
    drawBox(pad+boxW+20, '今日忌', r.copy.ji, red);
    // 幸运物
    x.textAlign='left'; x.textBaseline='middle'; x.font=font(32); x.fillStyle=ink;
    x.fillText('🍀 幸运物：'+r.copy.lucky, pad, 1345);
    // 彩蛋（与幸运物同款，无外框）
    x.font=font(32); x.fillStyle=ink;
    const pre='✨ 彩蛋：', preW=x.measureText(pre).width;
    x.fillText(pre, pad, 1415);
    let line='', yy=1415, first=true;
    for(const ch of r.copy.egg){
      const test=line+ch;
      if(x.measureText(test).width > (first?contentW-preW:contentW) && line){
        x.fillText(line, first?pad+preW:pad, yy); yy+=46; line=ch; first=false;
      }else line=test;
    }
    if(line) x.fillText(line, first?pad+preW:pad, yy);
    // 页脚
    x.textAlign='center'; x.font=font(26); x.fillStyle=ink;
    x.fillText('PaiFlow 苹果派 · paiflow.pages.dev', W/2, H-54);
    showCardModal(cv);
  });
}
function showCardModal(cv){
  let m=document.getElementById('cardModal');
  if(!m){
    m=document.createElement('div'); m.id='cardModal'; m.className='modal';
    m.innerHTML='<div class="modal-bg"></div><div class="modal-card"><div class="card-img"></div><div class="row" style="justify-content:center"><button class="btn" id="cardSave">保存图片</button><button class="btn ghost" id="cardClose">关闭</button></div></div>';
    document.body.appendChild(m);
    m.querySelector('.modal-bg').onclick=()=>m.classList.remove('show');
    m.querySelector('#cardClose').onclick=()=>m.classList.remove('show');
  }
  m.querySelector('#cardSave').onclick=()=>{ const a=document.createElement('a'); a.download='咸淡超人-今日状态卡.png'; a.href=cv.toDataURL('image/png'); a.click(); };
  const box=m.querySelector('.card-img'); box.innerHTML=''; box.appendChild(cv);
  cv.style.width='100%'; cv.style.height='auto'; cv.style.borderRadius='12px';
  m.classList.add('show');
}
renderWelcome();
